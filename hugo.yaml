# Hugo configuration file
title: Learn Algorithms and Design
baseURL: "https://gerarldlee.github.io/algorithmsbook.fociilabs.com/"
languageCode: "en-us"

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/gerarldlee/algorithmsbook.fociilabs.com"
      params:
        icon: github

params:
  description: Intuitively learn algorithms and system design for your interviews and sanity.

  # Site author (used by RSS and meta tags)
  author:
    name: Gerarld Lee
    email: gerarldlee@gmail.com

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/gerarldlee/algorithmsbook.fociilabs.com/edit/master/content"
